name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # pinned: ubuntu-latest moved to 26.04, which has no Python 3.8 build for setup-python
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # the renderer is standard library only; the tests are too. Export tests skip themselves without Node.
      - name: Unit tests (renderer, layout, importers, diff, example images)
        run: python -m unittest discover -s tests -v
        env:
          PLUMBLINE_SKIP_EXPORT: "1"

  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fonts for text rendering
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - name: Export tests (PNG, PDF, GIF)
        run: python -m unittest tests.test_plumbline.Export -v

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Committed example images match a fresh render
        run: |
          python tools/build_examples.py
          git diff --exit-code -- examples/*.svg
